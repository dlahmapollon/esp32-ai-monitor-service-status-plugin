name: Validate plugin packages

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check manifest and deterministic packages
        run: python3 scripts/package.py --check

  attention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pin the merged upstream format-2 contract (Mac 1.32.0).
      - uses: actions/checkout@v4
        with:
          repository: tobymarks/esp32-ai-monitor
          ref: d258e4228e2304d2c92cf82e85768e8a6d73c865
          path: .contract-host
      - name: Build format-2 plugin host
        run: cargo build --locked --manifest-path .contract-host/companion-windows/Cargo.toml -p aimonitor-plugin-host
      - name: Validate disruption rules and scenes
        run: python3 scripts/test_attention.py .contract-host/companion-windows/target/debug/aimonitor-plugin-host
